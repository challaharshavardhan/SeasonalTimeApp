/* Swipeable seasonal Muhurta clock — local and offline */
.clock-sectionhead{margin-bottom:10px}
.clock-shell{min-width:0}
.clock-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain;border-radius:19px;touch-action:pan-x pan-y}
.clock-carousel::-webkit-scrollbar{display:none}
.clock-slide{flex:0 0 100%;width:100%;min-width:0;scroll-snap-align:start;box-sizing:border-box}
.clock-panel{border-radius:19px;border:1px solid #e5e9df;background:#fff;padding:16px 16px 14px;min-height:316px;overflow:hidden}
.clock-panel.greenish{background:linear-gradient(160deg,#f5fbf6 0%,#fff 60%)}
.clock-panel.warmish{background:linear-gradient(160deg,#fff9ed 0%,#fff 60%)}
.clock-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.clock-kicker{font-size:10px;letter-spacing:1.05px;color:#9b664c;font-weight:800}
.clock-live{border-radius:99px;padding:5px 8px;font-weight:800;font-size:10px;background:#e0f0e5;color:#22664c;white-space:nowrap}
.clock-live.preview{background:#f4ece0;color:#926b48}
.clock-ring-holder{width:min(238px,80%);height:230px;position:relative;margin:0 auto;display:grid;place-items:center}
.clock-ring-svg{width:100%;height:100%;overflow:visible}
.clock-track{fill:none;stroke:#e8ede8;stroke-width:12}
.clock-prog{fill:none;stroke:#267561;stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:120px 120px;transition:stroke-dashoffset .7s linear}
.clock-ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:165px;gap:7px}
.clock-ring-center .clock-name{font-size:13px;font-weight:800;color:#304a3d}
.clock-ring-center .clock-remaining{font-size:31px;font-weight:850;color:#1f5c4e;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;line-height:1.1}
.clock-ring-center .clock-small{color:#84958a;font-size:11px}
.clock-range{text-align:center;color:#657b6f;font-size:12px;font-weight:650;line-height:1.5}
.clock-subline{text-align:center;color:#829187;font-size:11px;line-height:1.5;margin-top:7px}
.clock-indicator{display:flex;justify-content:center;gap:9px;margin:12px 0 8px;align-items:center}
.clock-dot{border:0;border-radius:99px;background:#d5dcd5;width:9px;height:9px;padding:0;transition:width .2s,background .2s}
.clock-dot.active{width:25px;background:#28735e}
.clock-help{font-size:11px;color:#859288;text-align:center;margin:0 0 4px}
.clock-list{max-height:222px;overflow-y:auto;overscroll-behavior:contain;margin:10px -4px 0;padding:0 4px;scrollbar-width:thin}
.clock-list.expanded{max-height:270px}
.clock-row{padding:9px 9px 10px;margin-bottom:7px;border:1px solid #edf0e9;border-radius:12px;background:#fff}
.clock-row.active{background:#f0f8f2;border-color:#86b7a1}
.clock-row.done{opacity:.65}
.clock-row.hidden{display:none}
.clock-row-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.clock-row-name{font-weight:800;color:#33483c;font-size:12px}
.clock-row-time{font-size:10px;color:#718378;white-space:nowrap}
.clock-row-bottom{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:10px;color:#86978a}
.clock-progress{margin-top:7px;background:#e4eae3;height:5px;border-radius:10px;overflow:hidden}
.clock-progress>span{display:block;height:100%;background:#2c7c65;border-radius:10px}
.clock-expand{font-size:11px;font-weight:800;color:#a05b3c;background:transparent;padding:10px 5px 0;display:block;margin:auto}
.clock-analog{width:min(230px,80%);margin:8px auto 0;display:block}
.clock-dial-txt{font-size:13px;fill:#78877e;font-weight:700;text-anchor:middle}
.clock-dialtrack{fill:none;stroke:#e6e8df;stroke-width:11}
.clock-dialprog{fill:none;stroke:#27765f;stroke-width:11;stroke-linecap:round;transform:rotate(-90deg);transform-origin:120px 120px;transition:stroke-dashoffset .7s linear}
.clock-hand{stroke-linecap:round}
.clock-analog-details{text-align:center;margin-top:3px}
.clock-analog-details strong{font-size:13px;display:block;color:#315243}
.clock-analog-details small{font-size:11px;color:#86958b;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.clock-named{padding:11px 12px;border-radius:12px;background:#f6f2e9;margin-top:10px;border:1px solid #eee8d9}
.clock-named b{font-size:11px;color:#775d49}
.clock-named p{margin:6px 0 0;color:#837967;font-size:11px;line-height:1.5}
.clock-named-item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:#5b685f}
.clock-named-item strong{font-size:11px;color:#305e4d;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock-named-item.avoid strong{color:#b05a4a}
@media(prefers-reduced-motion:reduce){.clock-carousel{scroll-behavior:auto}.clock-prog,.clock-dialprog{transition:none}}

function timingCard(e){const m=meta[e.id],kind=e.kind||m.kind;return `<button class="item ${kind==='avoid'?'avoid':''}" data-detail="${e.id}:${e.start}"><span class="ii">${icon(e.id)}</span><div class="mid"><h3>${m.name}</h3><p>${escapeHTML(e.note||m.desc)}</p></div><div class="right"><b>${hourFmt(e.start)}</b><small>to ${hourFmt(e.end)}</small></div></button>`;}
function allView(){let grouped={good:computed.events.filter(e=>(e.kind||meta[e.id].kind)==='good'),avoid:computed.events.filter(e=>(e.kind||meta[e.id].kind)==='avoid'),caution:computed.events.filter(e=>(e.kind||meta[e.id].kind)==='caution')};const tab=(key,label)=>`<button class="${state.filter===key?'active':''}" data-filter="${key}">${label}</button>`;return `${pageHead('Daily Muhurtams')}${ploc()}<h1 class="bigtitle">Every moment,<br><span class="accent">with intention.</span></h1><p class="desc">For ${niceDate(state.date)}. Select a time to learn how it is calculated.</p><label class="datechip" style="display:inline-flex">▦ Change date <input type="date" id="datePicker" value="${state.date}" min="2024-01-01" max="2036-12-31"></label><div class="filters">${tab('all','All timings')}${tab('good','Favorable')}${tab('avoid','Avoid')}</div>${[['good','Favorable times'],['caution','Special note'],['avoid','Traditionally avoided']].filter(([k])=>state.filter==='all'||(state.filter==='good'&&k==='good')||(state.filter==='avoid'&&k!=='good')).map(([k,label])=>grouped[k].length?`<div class="group-title"><span>${label}</span><span>${grouped[k].length} period${grouped[k].length===1?'':'s'}</span></div>${grouped[k].map(timingCard).join('')}`:'').join('')}${!computed.lunarOK?'<div class="notice">Nakshatra timings are available for dates between 2024 and 2036. For other dates, only sunrise-based periods are shown.</div>':''}<p class="topnote">These windows may overlap; a favorable period is not a personalized event muhurta.</p>`;}
function locationView(){const q=state.search.trim().toLowerCase();let filtered=CITIES.filter(x=>x[0].toLowerCase().includes(q)).slice(0,12);let searchResults=state.hits.filter(x=>!filtered.some(z=>z[0]===x[0]));return `${pageHead('Choose location')}<h1 class="bigtitle">Your location<br><span class="accent">shapes the day.</span></h1><p class="desc">Sunrise, sunset, and daily time periods change by date and location.</p><div class="inputbox"><span>⌕</span><input id="searchCity" placeholder="Search city, state or country" value="${escapeHTML(state.search)}" autocomplete="off" aria-label="Search cities"></div><button class="locitem locgeo" id="geo"><span class="locicon">◎</span><span><strong>Use my current location</strong><small>Requires browser location permission</small></span><span class="sel">›</span></button>${state.onlineError?`<div class="error" role="status">${escapeHTML(state.onlineError)}</div>`:''}${searchResults.length?`<div class="smallhead">Online city matches</div>${searchResults.map((c,i)=>locationButton(c,'hit',i)).join('')}`:''}<div class="row" style="margin:19px 0 12px"><span class="smallhead" style="margin:0">${q?'Matching saved cities':'Popular cities'}</span>${state.onlineLoading?'<span class="pill">Searching…</span>':''}</div>${filtered.length?filtered.map((c,i)=>locationButton(c,'preset',CITIES.indexOf(c))).join(''):'<div class="empty">No built-in match. Search online or enter coordinates below.</div>'}<div class="smallhead">Set exact coordinates (offline)</div><div class="formgrid"><label class="field">Latitude<input type="number" id="lat" step="any" min="-90" max="90" placeholder="17.385"></label><label class="field">Longitude<input type="number" id="lon" step="any" min="-180" max="180" placeholder="78.4867"></label></div><label class="field">Name of location<input id="customName" placeholder="My city"></label><label class="field">IANA time zone<input id="customZone" placeholder="Asia/Kolkata" value="${escapeHTML(state.city[3])}"></label><button class="primary" id="saveCustom">Use these coordinates</button><p class="topnote">Built-in cities and manual coordinates work offline. Online city search requires internet. GPS access may not work when opening the downloaded HTML file directly.</p>`;}
function locationButton(city,type,i){return `<button class="locitem" data-city="${type}:${i}"><span class="locicon">⌖</span><span><strong>${escapeHTML(city[0])}</strong><small>${city[1].toFixed(3)}°, ${city[2].toFixed(3)}° · ${escapeHTML(city[3])}</small></span>${JSON.stringify(city)===JSON.stringify(state.city)?'<span class="sel">✓</span>':''}</button>`;}
function detailView(){const e=computed.events.find(x=>`${x.id}:${x.start}`===state.selected);if(!e){state.tab='all';return allView();}const m=meta[e.id],kind=e.kind||m.kind;const ms=e.end-e.start;let description=kind==='caution'?'Wednesday exception / traditionally avoided':kind==='good'?'Favorable time':'Traditionally avoided';return `${pageHead('Muhurta details')}${ploc()}<section class="hero"><div class="glyph">${icon(e.id)}</div><div class="lbl">${description}</div><h1>${m.name}</h1><h2>${fmtRange(e)}</h2></section><div class="stats"><div><small>Starts at</small><b>${hourFmt(e.start)}</b></div><div><small>Duration</small><b>${Math.round(ms/MIN)} mins</b></div><div><small>Ends at</small><b>${hourFmt(e.end)}</b></div></div><section class="card"><h3>What is it?</h3><p>${escapeHTML(m.about)}${e.note?'<br><br>'+escapeHTML(e.note):''}</p></section><section class="card"><h3>How this time is determined</h3><p>${escapeHTML(m.how)}</p></section><button class="primary" id="calendar">▦ &nbsp; Add to calendar (.ics)</button><div class="notice">Timings follow the selected calculations and traditional tables, not a personalized marriage, travel, or ceremony muhurta. Other Panchangs may differ.</div>`;}
function settingsView(){return `${pageHead('Preferences & accuracy')}<h1 class="bigtitle">The details<br><span class="accent">behind your day.</span></h1><p class="desc">Calculation settings and source conventions.</p><div class="card"><div class="row"><div><h3 style="margin:0 0 5px">Dark mode</h3><p>Switch to a sapphire-night theme. Your choice is saved.</p></div><button id="themeToggle" class="toggle ${state.theme==='dark'?'on':''}" aria-label="Toggle dark mode" aria-pressed="${state.theme==='dark'}"></button></div></div><div class="card"><div class="row"><div><h3 style="margin:0 0 5px">24-hour clock</h3><p>Display times without AM/PM</p></div><button id="clockToggle" class="toggle ${state.clock24?'on':''}" aria-label="Toggle 24-hour clock" aria-pressed="${state.clock24}"></button></div></div><div class="card"><h3>Sunrise & sunset</h3><p>Calculated entirely offline from the date, latitude, longitude and time zone. Uses Swiss Ephemeris precomputed solar coordinates, an astronomical rise/set solver, and the upper limb at the horizon (−0.833° altitude including standard refraction). Level sea horizon assumed; mountains, elevation, and weather are not modeled.</p></div><div class="card"><h3>Lunar Nakshatra windows</h3><p>Moon transition UTC times are pre-calculated with Swiss Ephemeris (Moshier lunar ephemeris) and Lahiri ayanamsa, bundled for 2024–2036. Varjyam and Amrita Kalam use traditional four-ghati subdivisions of each Nakshatra's actual duration. These lunar events are the same absolute time worldwide; your city changes their displayed clock time and which local day contains them.</p></div><div class="card"><h3>Important interpretation notes</h3><p>Brahma Muhurta uses the penultimate 1/15 of the actual preceding night, not a fixed 48-minute period. Abhijit is the 8th daylight muhurta; Wednesdays are flagged. Durmuhurtham includes a Tuesday night slot. Different Telugu Panchangam publishers and family traditions can use different tables or sunrise conventions.</p></div><div class="card"><h3>Offline availability</h3><p>The single-file app runs without internet after downloading. Built-in cities and manual coordinates work offline; optional online city search and GPS require permissions or connectivity.</p></div><div class="card"><h3>Calculation references</h3><p><a href="https://www.drikpanchang.com/panchang/sunrise/panchang-sunrise.html" target="_blank" rel="noopener">Drik Panchang sunrise convention</a><br><a href="https://github.com/mourner/suncalc" target="_blank" rel="noopener">SunCalc solar algorithm background</a><br><a href="https://www.astro.com/swisseph/" target="_blank" rel="noopener">Swiss Ephemeris</a><br><a href="https://udaya.app/method/" target="_blank" rel="noopener">Varjyam / Amrita timing tables</a></p></div><div class="topnote">Muhurta · Prototype v0.1 · Not yet independently validated against daily Drik Panchang outputs.</div>`;}
function render(){rebuild();let view=state.tab==='today'?homeView():state.tab==='all'?allView():state.tab==='location'?locationView():state.tab==='detail'?detailView():settingsView();el('view').innerHTML=view;nav();bind();if(state.tab==='today'){clockLastLocalDay=todayParts();setupClockCarousel();}}
function go(tab){state.tab=tab;state.onlineError='';state.search='';state.hits=[];render();el('view').scrollTop=0;}
function useCity(c){state.city=c;save('muhurta.city',c);state.date=todayParts();save('muhurta.date',state.date);save('muhurta.sessionDay',state.date);go('today');}
let searchTimeout;
async function onlineCitySearch(q){try{const res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=en&format=json`,{signal:AbortSignal.timeout(6500)});if(!res.ok)throw Error('not available');let json=await res.json();if(state.search.trim()!==q)return;state.hits=(json.results||[]).filter(x=>x.timezone).map(x=>[`${x.name}, ${x.admin1?x.admin1+', ':''}${x.country}`,x.latitude,x.longitude,x.timezone]);state.onlineError=state.hits.length?'':'No additional cities found online. You can enter coordinates below.';}catch(err){if(state.search.trim()===q)state.onlineError='Online search unavailable. Built-in locations and coordinates still work offline.';}finally{state.onlineLoading=false;if(state.tab==='location')render();}}
function geoLocation(){const g=navigator.geolocation;if(!g){state.onlineError='This browser does not support location access. Enter coordinates instead.';render();return;}g.getCurrentPosition(pos=>{const zone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';useCity(['Current coordinates',pos.coords.latitude,pos.coords.longitude,zone]);},err=>{state.onlineError='Location permission unavailable or denied. Try choosing a city or entering coordinates.';render();},{enableHighAccuracy:false,timeout:12000,maximumAge:600000});}
function calendarFile(event){const toICS=n=>new Date(n).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const name=meta[event.id].name;const escapeICS=t=>String(t).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Muhurta//Daily Panchang//EN','BEGIN:VEVENT','UID:muhurta-'+event.id+'-'+Math.round(event.start/1000)+'@offline','DTSTAMP:'+toICS(Date.now()),'DTSTART:'+toICS(event.start),'DTEND:'+toICS(event.end),'SUMMARY:'+name,'DESCRIPTION:'+escapeICS('Traditionally calculated Muhurta period for '+state.city[0]+'. Confirm against your Panchang for important observances.'),'END:VEVENT','END:VCALENDAR'];const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Muhurta-'+event.id+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);}
function bind(){el('view').querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.tab)));
 el('view').querySelectorAll('[data-detail]').forEach(x=>x.addEventListener('click',()=>{state.selected=x.dataset.detail;go('detail');}));
 el('view').querySelectorAll('[data-filter]').forEach(x=>x.addEventListener('click',()=>{state.filter=x.dataset.filter;render();}));
 const dp=el('datePicker');if(dp)dp.addEventListener('change',e=>{if(!e.target.value)return;state.date=e.target.value;save('muhurta.date',state.date);save('muhurta.sessionDay',todayParts());render();});
 const search=el('searchCity');if(search){search.addEventListener('input',e=>{state.search=e.target.value;state.hits=[];state.onlineError='';let caret=search.selectionStart;let scroll=el('view').scrollTop;render();const inp=el('searchCity');inp.focus();inp.setSelectionRange(caret,caret);el('view').scrollTop=scroll;clearTimeout(searchTimeout);const q=state.search.trim();if(q.length>=3){searchTimeout=setTimeout(()=>{state.onlineLoading=true;onlineCitySearch(q)},650);}});}
 el('view').querySelectorAll('[data-city]').forEach(x=>x.addEventListener('click',()=>{const [type,idx]=x.dataset.city.split(':');useCity(type==='preset'?CITIES[+idx]:state.hits[+idx]);}));
 const geo=el('geo');if(geo)geo.addEventListener('click',geoLocation);
 const custom=el('saveCustom');if(custom)custom.addEventListener('click',()=>{let lat=Number(el('lat').value),lon=Number(el('lon').value),name=el('customName').value.trim()||'Custom location',zone=el('customZone').value.trim();if(!el('lat').value||!el('lon').value||lat < -90||lat>90||lon < -180||lon>180){state.onlineError='Enter valid latitude (−90 to 90) and longitude (−180 to 180).';render();return;}try{new Intl.DateTimeFormat('en-US',{timeZone:zone}).format(new Date());}catch(e){state.onlineError='Invalid time zone. Example: Asia/Kolkata or America/New_York.';render();return;}useCity([name,lat,lon,zone]);});
 ['themeToggle','themeQuick'].forEach(id=>{const btn=el(id);if(btn)btn.addEventListener('click',()=>{const previousScroll=el('view').scrollTop;setTheme(state.theme==='dark'?'light':'dark');render();el('view').scrollTop=previousScroll;});});
 const ct=el('clockToggle');if(ct)ct.addEventListener('click',()=>{state.clock24=!state.clock24;save('muhurta.clock24',state.clock24);render();});
 const cal=el('calendar');if(cal)cal.addEventListener('click',()=>{const e=computed.events.find(x=>`${x.id}:${x.start}`===state.selected);if(e)calendarFile(e);});
}
el('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab);});
render();
setInterval(clockTick,1000);
// Test-only read-only access, no network needed.
window.MuhurtaTest={sunTimes,buildEvents,localDayRange,zonedToUTC,getState:()=>state,shiftDay,buildClockPlan,clockCountdown,VARJ,AMRITA,LUNAR_DATA};
</script></body></html>


name: Build Muhurta Vishnu APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35'

      - name: Extract Vishnu app project
        run: unzip -q MuhurtaVishnu.zip -d project

      - name: Build Android APK
        run: gradle --no-daemon -p project/Muhurta-Lotus-Black-Glow-Project assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp project/Muhurta-Lotus-Black-Glow-Project/app/build/outputs/apk/debug/app-debug.apk output/Muhurta-Vishnu.apk

      - name: Upload renamed APK
        uses: actions/upload-artifact@v4
        with:
          name: Muhurta-Vishnu-APK
          path: output/Muhurta-Vishnu.apk
          if-no-files-found: error
          
